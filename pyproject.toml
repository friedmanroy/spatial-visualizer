[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-visualizer"
version = "0.1.0"
description = "Interactive Panel + Bokeh viewer for spatial transcriptomics AnnData (.h5ad) files"
readme = "README.md"
requires-python = ">=3.12"
# Exact pins so every user (including the double-click launchers) gets the same,
# known-working environment. This is the single list of dependencies -
# requirements.txt just points here.
dependencies = [
    "scanpy==1.12.4",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "panel==1.9.4",
    "bokeh==3.9.2",
    "matplotlib==3.11.2",
    "scikit-learn==1.9.1",
    "h5py==3.16.0",
    "umap-learn==0.5.12",
]

[project.scripts]
spatial-visualizer = "viewer.cli:main"

[tool.setuptools]
packages = ["viewer"]

[tool.setuptools.package-data]
viewer = ["data/*.json"]
